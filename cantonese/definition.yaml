name: Cantonese Chinese
dictionaries:
  - for: terms
    type: embedded
    url: https://words.hk/zise/[LUTE]
  - for: terms
    type: popup
    url: https://www.cantonese.sheik.co.uk/dictionary/search/?searchstring=[LUTE]
  - for: sentences
    type: popup
    url: https://www.deepl.com/translator#zh/en/[LUTE]
show_romanization: true
